name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # --self-test reads history: it reproduces each plugin's published base
          # identity with `git show <sha>:<path>`. A shallow clone does not carry
          # those commits, and the failure is `exit status 128` — the commit is
          # absent from the checkout, not the file wrong. `main`'s validate step
          # runs without --self-test, which is why main is green and this is not.
          fetch-depth: 0
      - name: Validate marketplace + plugin structure
        run: python3 .github/scripts/validate_plugins.py --self-test
      - name: Leak gate (client/PII identifiers)
        run: bash scripts/leak_scan.sh .
      - name: Skill-description cap gate (Claude Code skill listing)
        run: python3 scripts/check_skill_descriptions.py . --no-color --triggers
      - name: Large-queue routing and state contract
        run: python3 scripts/check_large_queue_guidance.py --self-test --ci-loader-gate
      - name: Panel input and installed snapshot contract
        run: python3 scripts/validate_panel_inputs.py --self-test
      - name: Canonical finalization-manifest contract
        run: python3 -m unittest scripts/test_finalization_manifest.py -v
      - name: Client final-byte review gate
        run: python3 -m unittest scripts/test_final_byte_review.py -v
      - name: Client action authority gate
        run: python3 -m unittest scripts/test_client_delivery_action_authority.py -v
      - name: Schedule-poll state machine
        run: python3 -m unittest scripts/test_schedule_poll_orchestrator.py -v
      - name: Canonical publisher controls
        run: |
          python3 -m unittest scripts/test_publish_codex_install.py -v
          python3 scripts/publish_codex_install.py self-test
