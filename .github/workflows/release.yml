name: Release on version bump

# Cuts a GitHub Release whenever the shipped version has no matching release yet.
# Bump VERSION in the same PR as the manifests.
#
# WHY THIS RUNS ON EVERY PUSH TO MAIN, not just on pushes touching VERSION.
#
# It used to filter `paths: ['VERSION']`. That filter has cost this repo nothing
# — dbeedd5 (2026-05-29) introduced VERSION and this workflow in the SAME commit
# at VERSION=1.1.0, and all six values VERSION has held since (1.1.0, 1.2.0,
# 1.2.1, 1.3.0, 1.3.1, 1.4.0) have a release. The three releases with no VERSION
# value behind them — v1.0.0, v1.0.1 and v1.0.2, all cut 2026-04-17 — pre-date
# that commit and were cut by hand. Bug present, damage none, measured rather
# than assumed.
#
# It is removed anyway, because in the repo this workflow was copied from the
# same filter lost a release for three months, and it lost it by NOT RUNNING —
# which leaves no failed run, no skip message, and nothing in the Actions list to
# notice. On agent-traffic-control:
#
#   43f4d62  "v1.13.0: ..."   marketplace.json + plugin.json -> 1.13.0
#                             VERSION UNTOUCHED, still 1.12.0   <- no trigger
#   6a49203  "v1.14.0: ..."   VERSION 1.12.0 -> 1.14.0          <- steps OVER 1.13.0
#
# `1.13.0` never existed in VERSION on main, so no later push could cut it either.
# The drift guard there DID catch the mismatch and went red on 43f4d62 (check-run
# completed_at 2026-08-07T10:56:58Z), and the human fix bumped to 1.14.0 —
# satisfying the guard while leaving the release permanently unreachable. A guard
# tells you a state is wrong; it does not tell you what that wrong state already
# cost.
#
# TWO REASONS THE FILTER IS WORSE HERE THAN IT WAS THERE.
#
# 1. It turns any TRANSIENT miss into a permanent one, which is the general form
#    of that bug rather than a special case of it. Filtered, the job's only retry
#    is the next change to VERSION — by which time VERSION holds a different
#    value, so the skipped one can never be cut. Unfiltered, every later push to
#    main re-attempts it, so a run lost to a token blip, a disabled workflow or a
#    runner outage self-heals on the next commit.
#
# 2. The guard that caught it upstream DOES NOT EXIST HERE. validate_plugins.py's
#    VERSION drift guard only compares VERSION against a plugin's version in a
#    SINGLE-plugin repo (see its rule 7). This bundle ships eight plugins, so a
#    commit that bumps the manifests and the README changelog while leaving
#    VERSION behind produces no red guard at all — not even the belated signal
#    that fired upstream, and not a skip message either.
#
# Running unconditionally is safe: the create step below is idempotent and skips
# when the release exists. The cost is a ~15s no-op job per push to main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Read VERSION
        id: v
        run: |
          V="$(tr -d '[:space:]' < VERSION)"
          [ -n "$V" ] || { echo "::error::VERSION file is empty"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          # NOTE: both branches exit 0, so this job's `conclusion: success` says
          # NOTHING about whether a release was cut. Read which line printed, or
          # check `gh release view v$V`.
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists — nothing to do."
          else
            echo "Cutting release v$V"
            gh release create "v$V" --title "v$V" --generate-notes
          fi
